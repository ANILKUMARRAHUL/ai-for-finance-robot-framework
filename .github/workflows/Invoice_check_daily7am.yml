name: Invoice Check 7AM IST
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BASE_URL: ${{ secrets.BASE_URL }}
      VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
      VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
      BROWSER: ${{ secrets.BROWSER }}
      TIMEOUT: ${{ secrets.TIMEOUT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Print Trigger Time
        run: |
          echo "UTC:"
          date -u
          echo "Runner Time:"
          date

      - name: Get Auth Tokens
        run: |
          RESPONSE_HEADERS=$(curl -s -D - -o /dev/null -X POST "http://20.235.55.214/api/v1/account/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${VALID_USERNAME}\", \"password\": \"${VALID_PASSWORD}\"}")

          ACCESS_TOKEN=$(echo "$RESPONSE_HEADERS" | grep -i '^set-cookie: access_token=' | sed -E 's/^[Ss]et-[Cc]ookie: access_token=([^;]+);.*/\1/' | tr -d '\r')
          REFRESH_TOKEN=$(echo "$RESPONSE_HEADERS" | grep -i '^set-cookie: refresh_token=' | sed -E 's/^[Ss]et-[Cc]ookie: refresh_token=([^;]+);.*/\1/' | tr -d '\r')

          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "Failed to extract tokens from login response headers"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$REFRESH_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
          echo "REFRESH_TOKEN=$REFRESH_TOKEN" >> "$GITHUB_ENV"

      - name: Run State Wise Data Loading Test
        run: |
          robot --variable HEADLESS:True \
                --variable ACCESS_TOKEN:${{ env.ACCESS_TOKEN }} \
                --variable REFRESH_TOKEN:${{ env.REFRESH_TOKEN }} \
                -d results -t "Validate State Wise Data Loading" Testcases/InvoiceCheck/dashboard_testcases.robot

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-wise-data-load-results
          path: results/
