name: Invoice Check 7AM IST
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BASE_URL: ${{ secrets.BASE_URL }}
      VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
      VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
      BROWSER: ${{ secrets.BROWSER }}
      TIMEOUT: ${{ secrets.TIMEOUT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Print Trigger Time
        run: |
          echo "UTC:"
          date -u
          echo "Runner Time:"
          date

      - name: Show Runner IP
        run: |
          echo "GitHub Actions runner public IP:"
          curl -s https://api.ipify.org
          echo ""

      - name: Get Auth Tokens
        run: |
          LOGIN_URL="${BASE_URL%/}/api/v1/account/login/"
          echo "Hitting login endpoint: $LOGIN_URL"

          HTTP_STATUS=$(curl -s -D headers.txt -o body.txt -w "%{http_code}" -X POST "$LOGIN_URL" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -d "{\"username\": \"${VALID_USERNAME}\", \"password\": \"${VALID_PASSWORD}\"}")

          echo "HTTP Status Code: $HTTP_STATUS"
          echo "--- Response Headers ---"
          cat headers.txt
          echo "--- Response Body (first 500 chars) ---"
          head -c 500 body.txt
          echo ""

          RESPONSE_HEADERS=$(cat headers.txt)

          ACCESS_TOKEN=$(echo "$RESPONSE_HEADERS" | grep -i '^set-cookie: access_token=' | sed -E 's/^[Ss]et-[Cc]ookie: access_token=([^;]+);.*/\1/' | tr -d '\r')
          REFRESH_TOKEN=$(echo "$RESPONSE_HEADERS" | grep -i '^set-cookie: refresh_token=' | sed -E 's/^[Ss]et-[Cc]ookie: refresh_token=([^;]+);.*/\1/' | tr -d '\r')

          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "Failed to extract tokens from login response headers"
            echo "This likely means the request was redirected to SSO or blocked instead of reaching the real login API."
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$REFRESH_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
          echo "REFRESH_TOKEN=$REFRESH_TOKEN" >> "$GITHUB_ENV"

      - name: Run State Wise Data Loading Test
        run: |
          robot --variable HEADLESS:True \
                --variable ACCESS_TOKEN:${{ env.ACCESS_TOKEN }} \
                --variable REFRESH_TOKEN:${{ env.REFRESH_TOKEN }} \
                -d results -t "Validate State Wise Data Loading" Testcases/InvoiceCheck/dashboard_testcases.robot

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-wise-data-load-results
          path: results/
